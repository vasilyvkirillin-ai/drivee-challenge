<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivee Expedition Map</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
        }
        #map {
            width: 100%;
            height: calc(100% - 110px);
            position: absolute;
            top: 0;
            left: 0;
        }
        .info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
        
            background: #FFFFFF;
        
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        
            box-shadow: 0 -4px 20px rgba(0,0,0,.08);
        
            padding: 16px 18px;
        
            display: flex;
            align-items: center;
            justify-content: space-between;
        
            box-sizing: border-box;
            z-index: 1000;
        
            min-height: 110px;
        }
                
        .info-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .info-title {
            margin: 0;
            font-size: 12px;
            font-weight: 500;
            color: #373C46;
        }
        
        .info-current {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #1E1E1E;
        }
        .close-btn {
            background: #F5F7F9;
            color: #373C46;
        
            border: none;
            border-radius: 12px;
        
            padding: 12px 16px;
        
            font-size: 14px;
            font-weight: 600;
        
            cursor: pointer;
        }
        .center-btn {
            background: #96EA28;
            color: #1E1E1E;
        
            border: none;
            border-radius: 12px;
        
            padding: 12px 16px;
        
            font-size: 14px;
            font-weight: 700;
        
            cursor: pointer;
        
            transition: .2s;
        }
        
        .center-btn:hover {
            transform: translateY(-1px);
        }
        /* Стили для красивых всплывающих окон (Popups) */
        .leaflet-popup-content-wrapper {
            border-radius: 16px;
            padding: 0;
            overflow: hidden;
            box-shadow:
                0 10px 30px rgba(0,0,0,.12),
                0 2px 8px rgba(0,0,0,.08);
        }
        
        .leaflet-popup-content {
            margin: 0;
            width: 300px !important;
        }
        
        .leaflet-popup-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            margin: -10px -10px 12px -10px;
            width: calc(100% + 20px);
            border-radius: 12px 12px 0 0;
        }
        
        .leaflet-popup-content-header {
            font-size: 20px;
            font-weight: 700;
            color: #1E1E1E;
            padding: 0 16px;
            margin-bottom: 10px;
        }
        
        .leaflet-popup-content-desc {
            padding: 0 16px 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #373C46;
        }
        
        /* Стили для пульсирующей точки текущего города */
        .current-marker {
            background-color: #96EA28;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 0 0 rgba(150,234,40,.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% {
                transform: scale(.9);
                box-shadow: 0 0 0 0 rgba(150,234,40,.6);
            }
        
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 14px rgba(150,234,40,0);
            }
        
            100% {
                transform: scale(.9);
                box-shadow: 0 0 0 0 rgba(150,234,40,0);
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="info-panel">
        <div class="info-text">
            <p class="info-title">Текущая локация экспедиции:</p>
            <p id="current-city-name" class="info-current">Загрузка...</p>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="center-btn" onclick="focusCurrentCity()">
                🎯 Моя точка
            </button>
        
            <button class="close-btn" onclick="Telegram.WebApp.close();">
                Закрыть
            </button>
        </div>
    </div>

    <script>
(async () => {
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
    
        // ПОЛНЫЙ СПИСОК ГОРОДОВ С ТЕКСТАМИ ОПИСАНИЙ ИЗ ТВОЕГО БОТА
        const CITIES = [
            { steps: 0, name: "Москва 🏰", lat: 55.7558, lon: 37.6173, image: "images/moscow.jpg", desc: "Старт! Самый большой город Европы и начало нашего приключения." },
            { steps: 450000, name: "Владимир ⛩️", lat: 56.1290, lon: 40.4070, image: "images/vladimir.jpg", desc: "Древняя столица Руси, знаменитая своими белокаменными соборами." },
            { steps: 900000, name: "Нижний Новгород 🎡", lat: 56.3269, lon: 44.0059, image: "images/novgorod.jpg", desc: "Здесь Ока впадает в Волгу, а лестница к реке насчитывает 560 ступеней." },
            { steps: 1400000, name: "Чебоксары 🌅", lat: 56.1322, lon: 47.2515, image: "images/cheboksary.jpg", desc: "Столица Чувашии, где стоит один из самых высоких памятников матери в мире." },
            { steps: 1900000, name: "Казань 🕌", lat: 55.7961, lon: 49.1064, image: "images/kazan.jpg", desc: "Здесь восточная и западная культуры встречаются в Казанском Кремле." },
            { steps: 2400000, name: "Набережные Челны 🚛", lat: 55.7415, lon: 52.3992, image: "images/nab_chelny.jpg", desc: "Родина легендарных КАМАЗов, 19-кратных победителей ралли «Дакар»." },
            { steps: 3000000, name: "Уфа 🍯", lat: 54.7351, lon: 55.9587, image: "images/ufa.jpg", desc: "Уфа — самый зеленый город-миллионник в России." },
            { steps: 3500000, name: "Златоуст ⚒️", lat: 55.1711, lon: 59.6508, image: "images/zlatoust.jpg", desc: "Город мастеров, где делают знаменитые на весь мир гравюры на стали." },
            { steps: 4100000, name: "Челябинск ☄️", lat: 55.1540, lon: 61.4291, image: "images/chelyabinsk.jpg", desc: "Суровый и прекрасный город, переживший падение метеорита в 2013 году." },
            { steps: 4600000, name: "Курган 🏛️", lat: 55.4410, lon: 65.3411, image: "images/kurgan.jpg", desc: "Здесь находится знаменитый центр Илизарова, где «выращивают» кости." },
            { steps: 5200000, name: "Тюмень 🌡️", lat: 57.1522, lon: 65.5272, image: "images/tiumen.jpg", desc: "Первый город Сибири, знаменитый своими горячими источниками." },
            { steps: 5900000, name: "Омск 🎭", lat: 54.9885, lon: 73.3242, image: "images/omsk.jpg", desc: "В Омске находится здание управления железной дороги, в котором более 300 окон." },
            { steps: 6500000, name: "Новосибирск 🔬", lat: 55.0084, lon: 82.9357, image: "images/novosibirsk.jpg", desc: "Самый быстрорастущий город мира, попавший в Книгу рекордов Гиннесса." },
            { steps: 7100000, name: "Кемерово ⚒️", lat: 55.3450, lon: 86.0821, image: "images/kemerevo.jpg", desc: "Сердце Кузбасса, где добывают больше половины всего угля в России." },
            { steps: 7800000, name: "Красноярск ⛰️", lat: 56.0153, lon: 92.8932, image: "images/krasnoyarsk.jpg", desc: "Город на Енисее, окруженный уникальными скалами — Столбами." },
            { steps: 8400000, name: "Канск 🌲", lat: 56.2061, lon: 95.7061, image: "images/kansk.jpg", desc: "Сибирский город, в котором ежегодно проходит международный видеофестиваль." },
            { steps: 9100000, name: "Иркутск (Байкал) 🌊", lat: 52.2870, lon: 104.3050, image: "images/irkutsk.jpg", desc: "Ворота к самому глубокому и чистому озеру на планете." },
            { steps: 9700000, name: "Улан-Удэ ⛩️", lat: 51.8292, lon: 107.5930, image: "images/ulanude.jpg", desc: "Центр буддизма в России, где находится самая большая голова Ленина." },
            { steps: 10300000, name: "Чита 🚅", lat: 52.0317, lon: 113.5009, image: "images/chita.jpg", desc: "Солнечная столица Забайкалья, место ссылки многих декабристов." },
            { steps: 10930000, name: "Нерюнгри 🏔️", lat: 56.6567, lon: 124.7200, image: "images/neryungri.jpg", desc: "Южные ворота Якутии. Молодой город шахтёров, окружённый суровой красотой якутской тайги." },
            { steps: 11000000, name: "Якутск 💎", lat: 62.0308, lon: 129.7422, image: "images/yakutsk.jpg", desc: "Финиш! Крупнейший город на вечной мерзлоте. Вы это сделали!" }
        ];

        async function getSteps() {
            const response = await fetch("https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQPmzhY4iVMDGdlnxTzBaPSq6kHSaRDQHpmNdfEzHXtjWAac8qolZKmus6HsiTuiPT9EulYmhBoHz7BRkylG4iN-N2mtDb3etF1rOTcizjsc5akRMw0HWpddDi6bn0wCEHVqwFHC8XSDJTs1YD6VgIct2PiFJWIGu1dw0HHk_1xohg-fTM9HaKzy5arpeJ_fCltAt8EogOeu5TIr0qfi1TUKOHQdGAYhJhg-Dl0gFA4pr5lIW837koX10r1xEO1-OFf1eVi9T_MDfJdxNSOofZikjJzIg&lib=Mnr5-Xmnz2K4uRongV6o0nKVQSSnWPj7K");
            return await response.json();
        }

        let totalSteps = 0;
    
        try {
            const apiData = await getSteps();
            totalSteps = Number(apiData.totalSteps || 0);
        } catch (e) {
            console.error("Ошибка загрузки шагов", e);
        }
        
        const progressPercent = Math.min(
            (totalSteps / 11000000) * 100,
            100
        );
        
        const filledBlocks = Math.round(progressPercent / 10);
        
        const progressBar =
            "🟦".repeat(filledBlocks) +
            "⬜️".repeat(10 - filledBlocks);
       
        // Находим текущий город
        let currentCity = CITIES[0];
        for (let i = 0; i < CITIES.length; i++) {
            if (totalSteps >= CITIES[i].steps) {
                currentCity = CITIES[i];
            }
        }
        window.focusCurrentCity = function () {
        
            map.flyTo(
                [currentCity.lat, currentCity.lon],
                6,
                { duration: 1.5 }
            );
        
            map.eachLayer(layer => {
                if (layer.getPopup && layer.getPopup()) {
                    const popup = layer.getPopup();
        
                    if (
                        popup.getContent().includes(currentCity.name)
                    ) {
                        layer.openPopup();
                    }
                }
            });
        };
        // Обновляем плашку внизу экрана
        document.getElementById('current-city-name').innerText = currentCity.name;

        // Создаем карту и центрируем на текущей точке
        const map = L.map('map').setView([currentCity.lat, currentCity.lon], 5);

        // Загружаем карту
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Отрисовываем города и привязываем к ним описания
        CITIES.forEach(city => {
            // Формируем красивое текстовое окно с описанием как в боте
            const popupText = `
                <div class="leaflet-popup-content-header">
                    ${city.name}
                </div>
            
                <img
                    class="leaflet-popup-image"
                    src="${city.image}"
                    alt="${city.name}"
                    loading="lazy"
                    onerror="this.style.display='none'"
                >
            
                <div style="
                    margin:12px 16px;
                    padding:12px;
                    background:#F5F7F9;
                    border-radius:12px;
                    font-size:13px;
                    line-height:1.6;
                ">
                    📈 ${progressBar} ${progressPercent.toFixed(1)}%<br>
                    👣 ${totalSteps.toLocaleString('ru-RU')} /
                    ${(11000000).toLocaleString('ru-RU')}
                </div>
            
                <div class="leaflet-popup-content-desc">
                    ${city.desc}
                </div>
            `;

            if (city === currentCity) {
                // Пульсирующий синий маркер для текущего города
                const pulseIcon = L.divIcon({
                    className: 'current-marker',
                    iconSize: [20, 20]
                });
                L.marker([city.lat, city.lon], { icon: pulseIcon })
                    .addTo(map)
                    .bindPopup(popupText)
                    .openPopup(); // Открываем текст текущего города сразу
            } else if (totalSteps >= city.steps) {
                // Пройденные города — зеленые маркеры
                L.circleMarker([city.lat, city.lon], {
                    radius: 7,
                    fillColor: '#96EA28',
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 1
                }).addTo(map).bindPopup(popupText);
            } else {
                // Закрытые города — серые точки
                L.circleMarker([city.lat, city.lon], {
                    radius: 5,
                    fillColor: '#95a5a6',
                    color: '#fff',
                    weight: 1,
                    fillOpacity: 0.7
                }).addTo(map).bindPopup(`
                    <div class="leaflet-popup-content-header">🔒 ${city.name}</div>
                    <div class="leaflet-popup-content-desc">Город пока закрыт. Требуется шагов всей команды: <b>${city.steps.toLocaleString('ru-RU')}</b></div>
                `);
            }
        });
    
})();
</script>
</body>
</html>
