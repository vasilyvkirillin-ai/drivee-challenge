<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivee Expedition Map</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
        }
        #map {
            width: 100%;
            height: calc(100% - 70px);
            position: absolute;
            top: 0;
            left: 0;
        }
        .info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: white;
            box-shadow: 0 -3px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 1000;
        }
        .info-text {
            display: flex;
            flex-direction: column;
        }
        .info-title { font-size: 13px; color: #7f8c8d; margin: 0; }
        .info-current { font-size: 15px; font-weight: bold; color: #2c3e50; margin: 2px 0 0 0; }
        .close-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Стили для красивых всплывающих окон (Popups) */
        .leaflet-popup-content-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }
        .leaflet-popup-content-desc {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            font-style: italic;
        }
        /* Стили для пульсирующей точки текущего города */
        .current-marker {
            background-color: #3498db;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(52, 152, 219, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(52, 152, 219, 0); }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="info-panel">
        <div class="info-text">
            <p class="info-title">Текущая локация экспедиции:</p>
            <p id="current-city-name" class="info-current">Загрузка...</p>
        </div>
        <button class="close-btn" onclick="Telegram.WebApp.close();">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ПОЛНЫЙ СПИСОК ГОРОДОВ С ТЕКСТАМИ ОПИСАНИЙ ИЗ ТВОЕГО БОТА
        const CITIES = [
            { steps: 0, name: "Москва 🏰", lat: 55.7558, lon: 37.6173, desc: "Старт! Шумная столица, сердце страны и отправная точка нашего грандиозного путешествия на восток." },
            { steps: 450000, name: "Владимир ⛩️", lat: 56.1290, lon: 40.4070, desc: "Жемчужина Золотого кольца. Здесь история Древней Руси дышит сквозь величественные белокаменные соборы." },
            { steps: 900000, name: "Нижний Новгород 🎡", lat: 56.3269, lon: 44.0059, desc: "Столица закатов! Место слияния Оки и Волги, знаменитое своей грандиозной Чкаловской лестницей." },
            { steps: 1400000, name: "Чебоксары 🌅", lat: 56.1322, lon: 47.2515, desc: "Уютная столица Чувашии, встречающая путешественников прекрасными видами на Волгу и монументом Матери-Покровительницы." },
            { steps: 1900000, name: "Казань 🕌", lat: 55.7961, lon: 49.1064, desc: "Город контрастов! Место, где причудливо переплетаются Восток и Запад, а эчпочмак вкуснее любых похвал." },
            { steps: 2400000, name: "Набережные Челны 🚛", lat: 55.7415, lon: 52.3992, desc: "Автомобильная столица Татарстана. Родина мощных КАМАЗов, покоривших сложнейшие трассы ралли «Дакар»." },
            { steps: 3000000, name: "Уфа 🍯", lat: 54.7351, lon: 55.9587, desc: "Город трех шурупов и потрясающего меда! Один из самых зеленых и просторных мегаполисов России." },
            { steps: 3500000, name: "Златоуст ⚒️", lat: 55.1711, lon: 59.6508, desc: "Уральская кузница талантов. Город суровых мастеров, создающих шедевры знаменитой гравюры на стали." },
            { steps: 4100000, name: "Челябинск ☄️", lat: 55.1540, lon: 61.4291, desc: "Город с железным характером, где индустриальная мощь соседствует с космической историей о метеорите." },
            { steps: 4600000, name: "Курган 🏛️", lat: 55.4410, lon: 65.3411, desc: "Врата Сибири. Город, прославившийся на весь мир уникальным научным центром ортопедии Илизарова." },
            { steps: 5200000, name: "Тюмень 🌡️", lat: 57.1522, lon: 65.5272, desc: "Первый русский город в Сибири! Отлично согреет на пути своими знаменитыми термальными источниками." },
            { steps: 5900000, name: "Омск 🎭", lat: 54.9885, lon: 73.3242, desc: "Солнечный город на Иртыше с богатым театральным наследием и впечатляющей купеческой архитектурой." },
            { steps: 6800000, name: "Томск 🎓", lat: 56.5010, lon: 84.9924, desc: "Старинный университетский город Сибири. Здесь сосредоточены ведущие вузы и один из самых красивых деревянных архитектурных ансамблей России." },
            { steps: 6500000, name: "Новосибирск 🔬", lat: 55.0084, lon: 82.9357, desc: "Научное сердце Сибири. Рекордсмен по скорости роста и дом для всемирно известного Академгородка." },
            { steps: 6800000, name: "Томск 🎓", lat: 56.5010, lon: 84.9924, desc: "Старинный университетский город Сибири. Здесь сосредоточены ведущие вузы и один из самых красивых деревянных архитектурных ансамблей России." },
            { steps: 7100000, name: "Кемерово ⚒️", lat: 55.3450, lon: 86.0821, desc: "Угольная столица страны. Могучее сердце Кузбасса, согревающее своими недрами всю Россию." },
            { steps: 7500000, name: "Ачинск 🏭", lat: 56.2694, lon: 90.4993, desc: "Важный промышленный узел Красноярского края и одна из ключевых станций легендарного Транссиба." },
            { steps: 7800000, name: "Красноярск ⛰️", lat: 56.0153, lon: 92.8932, desc: "Сибирский мегаполис на берегах могучего Енисея, хранитель мистических скал природного парка «Столбы»." },
            { steps: 8400000, name: "Канск 🌲", lat: 56.2061, lon: 95.7061, desc: "Небольшой, но яркий сибирский город, бросающий вызов Каннам своим уникальным международным видеофестивалем." },
            { steps: 8750000, name: "Тайшет 🚂", lat: 55.9405, lon: 98.0031, desc: "Место рождения Байкало-Амурской магистрали. Отсюда начинается знаменитый БАМ — одна из величайших железных дорог мира." },
            { steps: 9100000, name: "Иркутск (Байкал) 🌊", lat: 52.2870, lon: 104.3050, desc: "Жемчужина Сибири и главные ворота к священному, самому глубокому и чистому озеру планеты." },
            { steps: 9400000, name: "Усолье-Сибирское 🧂", lat: 52.7566, lon: 103.6388, desc: "Город на Ангаре, выросший вокруг соляных промыслов и ставший важной частью истории Прибайкалья." },
            { steps: 9700000, name: "Улан-Удэ ⛩️", lat: 51.8292, lon: 107.5930, desc: "Город с уникальным колоритом, где традиции буддизма уживаются с самым большим в мире памятником-головой Ленина." },
            { steps: 10300000, name: "Чита 🚅", lat: 52.0317, lon: 113.5009, desc: "Суровый, но пропитанный солнцем край Забайкалья. Город с богатой историей, хранящий память о декабристах." },
            { steps: 10650000, name: "Могоча 🌄", lat: 53.7333, lon: 119.7667, desc: "Таёжные ворота Дальнего Востока. Город среди бескрайних лесов и гор Забайкалья." },
            { steps: 10850000, name: "Тында 🚞", lat: 55.1544, lon: 124.7469, desc: "Столица БАМа. Легендарный город строителей, возникший благодаря одной из самых масштабных строек XX века." }, 
            { steps: 10930000, name: "Нерюнгри 🏔️", lat: 56.6567, lon: 124.7200, desc: "Южные ворота Якутии. Молодой город шахтёров, окружённый суровой красотой якутской тайги." }
            { steps: 11000000, name: "Якутск 💎", lat: 62.0308, lon: 129.7422, desc: "Финиш! Алмазная столица и крупнейший город на вечной мерзлоте. Вы покорили этот невероятный маршрут!" }
        ];

        // ТЕСТОВОЕ КОЛИЧЕСТВО ШАГОВ (Замени на актуальное для проверки)
        const totalSteps = 5418000; 

        // Находим текущий город
        let currentCity = CITIES[0];
        for (let i = 0; i < CITIES.length; i++) {
            if (totalSteps >= CITIES[i].steps) {
                currentCity = CITIES[i];
            }
        }

        // Обновляем плашку внизу экрана
        document.getElementById('current-city-name').innerText = currentCity.name;

        // Создаем карту и центрируем на текущей точке
        const map = L.map('map').setView([currentCity.lat, currentCity.lon], 5);

        // Загружаем карту
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Отрисовываем города и привязываем к ним описания
        CITIES.forEach(city => {
            // Формируем красивое текстовое окно с описанием как в боте
            const popupText = `
                <div class="leaflet-popup-content-header">${city.name}</div>
                <div class="leaflet-popup-content-desc">${city.desc}</div>
            `;

            if (city.name === currentCity.name) {
                // Пульсирующий синий маркер для текущего города
                const pulseIcon = L.divIcon({
                    className: 'current-marker',
                    iconSize: [16, 16]
                });
                L.marker([city.lat, city.lon], { icon: pulseIcon })
                    .addTo(map)
                    .bindPopup(popupText)
                    .openPopup(); // Открываем текст текущего города сразу
            } else if (totalSteps >= city.steps) {
                // Пройденные города — зеленые маркеры
                L.circleMarker([city.lat, city.lon], {
                    radius: 7,
                    fillColor: '#2ecc71',
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 1
                }).addTo(map).bindPopup(popupText);
            } else {
                // Закрытые города — серые точки
                L.circleMarker([city.lat, city.lon], {
                    radius: 5,
                    fillColor: '#95a5a6',
                    color: '#fff',
                    weight: 1,
                    fillOpacity: 0.7
                }).addTo(map).bindPopup(`
                    <div class="leaflet-popup-content-header">🔒 ${city.name}</div>
                    <div class="leaflet-popup-content-desc">Город пока закрыт. Требуется шагов всей команды: <b>${city.steps.toLocaleString('ru-RU')}</b></div>
                `);
            }
        });
    </script>
</body>
</html>
