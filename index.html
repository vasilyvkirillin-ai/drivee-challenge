<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drivee Step Challenge Map</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
        }
        #map {
            width: 100%;
            height: calc(100% - 110px);
            position: absolute;
            top: 0;
            left: 0;
        }
        .info-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
        
            background: #FFFFFF;
        
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        
            box-shadow: 0 -4px 20px rgba(0,0,0,.08);
        
            padding: 16px 18px;
        
            display: flex;
            align-items: center;
            justify-content: space-between;
        
            box-sizing: border-box;
            z-index: 1000;
        
            height: 110px;
        }
                
        .info-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .info-title {
            margin: 0;
            font-size: 12px;
            font-weight: 500;
            color: #373C46;
        }
        
        .info-current {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #1E1E1E;
        }
        .close-btn {
            background: #F5F7F9;
            color: #373C46;
        
            border: none;
            border-radius: 12px;
        
            padding: 12px 16px;
        
            font-size: 14px;
            font-weight: 600;
        
            cursor: pointer;
        }
        .center-btn {
            background: #96EA28;
            color: #1E1E1E;
        
            border: none;
            border-radius: 12px;
        
            padding: 12px 16px;
        
            font-size: 14px;
            font-weight: 700;
        
            cursor: pointer;
        
            transition: .2s;
        }
        
        .center-btn:hover {
            transform: translateY(-1px);
        }
        /* Стили для красивых всплывающих окон (Popups) */
        .leaflet-popup-content-wrapper {
            border-radius: 16px;
            padding: 0;
            overflow: hidden;
            box-shadow:
                0 10px 30px rgba(0,0,0,.12),
                0 2px 8px rgba(0,0,0,.08);
        }
        
        .leaflet-popup-content {
            margin: 0;
            width: 300px !important;
        }

        .leaflet-popup-content-header {
            font-size: 20px;
            font-weight: 700;
            color: #1E1E1E;
            padding: 16px 16px 0;
            margin-bottom: 10px;
        }
        
        .leaflet-popup-content-desc {
            padding: 0 16px 16px;
            font-size: 14px;
            line-height: 1.6;
            color: #373C46;
        }
        
        /* Стили для пульсирующей точки текущего города */
        .current-marker {
            width: 20px;
            height: 20px;
            background-color: #e74c3c;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 0 0 0 rgba(150,234,40,.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% {
                transform: scale(.9);
                box-shadow: 0 0 0 0 rgba(150,234,40,.6);
            }
        
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 14px rgba(150,234,40,0);
            }
        
            100% {
                transform: scale(.9);
                box-shadow: 0 0 0 0 rgba(150,234,40,0);
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="info-panel">
        <div class="info-text">
            <p class="info-title">Текущий город челленджа:</p>
            <p id="current-city-name" class="info-current">Загрузка...</p>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="center-btn" onclick="focusCurrentCity()">
                🎯 Где мы?
            </button>
        
            <button class="close-btn" onclick="
            if(window.Telegram && window.Telegram.WebApp){
                Telegram.WebApp.close();
            }">
                Закрыть
            </button>
        </div>
    </div>

    <script>
(async () => {
        if (window.Telegram && window.Telegram.WebApp) {
            const tg = window.Telegram.WebApp;
            tg.ready();
            tg.expand();
        }
    
        // ПОЛНЫЙ СПИСОК ГОРОДОВ С ТЕКСТАМИ ОПИСАНИЙ ИЗ ТВОЕГО БОТА
        const CITIES = [
            { steps: 0, name: "Москва 🏰", lat: 55.7558, lon: 37.6173, image: "images/moscow.jpg", desc: "Старт! Самый большой город Европы и начало нашего приключения." },
            { steps: 450000, name: "Владимир ⛩️", lat: 56.1290, lon: 40.4070, image: "images/vladimir.jpg", desc: "Древняя столица Руси, знаменитая своими белокаменными соборами." },
            { steps: 900000, name: "Нижний Новгород 🎡", lat: 56.3269, lon: 44.0059, image: "images/novgorod.jpg", desc: "Здесь Ока впадает в Волгу, а лестница к реке насчитывает 560 ступеней." },
            { steps: 1400000, name: "Чебоксары 🌅", lat: 56.1322, lon: 47.2515, image: "images/cheboksary.jpg", desc: "Столица Чувашии, где стоит один из самых высоких памятников матери в мире." },
            { steps: 1900000, name: "Казань 🕌", lat: 55.7961, lon: 49.1064, image: "images/kazan.jpg", desc: "Здесь восточная и западная культуры встречаются в Казанском Кремле." },
            { steps: 2400000, name: "Набережные Челны 🚛", lat: 55.7415, lon: 52.3992, image: "images/nab_chelny.jpg", desc: "Родина легендарных КАМАЗов, 19-кратных победителей ралли «Дакар»." },
            { steps: 3000000, name: "Уфа 🍯", lat: 54.7351, lon: 55.9587, image: "images/ufa.jpg", desc: "Уфа — самый зеленый город-миллионник в России." },
            { steps: 3500000, name: "Златоуст ⚒️", lat: 55.1711, lon: 59.6508, image: "images/zlatoust.jpg", desc: "Город мастеров, где делают знаменитые на весь мир гравюры на стали." },
            { steps: 4100000, name: "Челябинск ☄️", lat: 55.1540, lon: 61.4291, image: "images/chelyabinsk.jpg", desc: "Суровый и прекрасный город, переживший падение метеорита в 2013 году." },
            { steps: 4600000, name: "Курган 🏛️", lat: 55.4410, lon: 65.3411, image: "images/kurgan.jpg", desc: "Здесь находится знаменитый центр Илизарова, где «выращивают» кости." },
            { steps: 5200000, name: "Тюмень 🌡️", lat: 57.1522, lon: 65.5272, image: "images/tiumen.jpg", desc: "Первый город Сибири, знаменитый своими горячими источниками." },
            { steps: 5900000, name: "Омск 🎭", lat: 54.9885, lon: 73.3242, image: "images/omsk.jpg", desc: "В Омске находится здание управления железной дороги, в котором более 300 окон." },
            { steps: 6500000, name: "Новосибирск 🔬", lat: 55.0084, lon: 82.9357, image: "images/novosibirsk.jpg", desc: "Самый быстрорастущий город мира, попавший в Книгу рекордов Гиннесса." },
            { steps: 7100000, name: "Кемерово ⚒️", lat: 55.3450, lon: 86.0821, image: "images/kemerevo.jpg", desc: "Сердце Кузбасса, где добывают больше половины всего угля в России." },
            { steps: 7800000, name: "Красноярск ⛰️", lat: 56.0153, lon: 92.8932, image: "images/krasnoyarsk.jpg", desc: "Город на Енисее, окруженный уникальными скалами — Столбами." },
            { steps: 8400000, name: "Канск 🌲", lat: 56.2061, lon: 95.7061, image: "images/kansk.jpg", desc: "Сибирский город, в котором ежегодно проходит международный видеофестиваль." },
            { steps: 9100000, name: "Иркутск (Байкал) 🌊", lat: 52.2870, lon: 104.3050, image: "images/irkutsk.jpg", desc: "Ворота к самому глубокому и чистому озеру на планете." },
            { steps: 9700000, name: "Улан-Удэ ⛩️", lat: 51.8292, lon: 107.5930, image: "images/ulanude.jpg", desc: "Центр буддизма в России, где находится самая большая голова Ленина." },
            { steps: 10300000, name: "Чита 🚅", lat: 52.0317, lon: 113.5009, image: "images/chita.jpg", desc: "Солнечная столица Забайкалья, место ссылки многих декабристов." },
            { steps: 10930000, name: "Нерюнгри 🏔️", lat: 56.6567, lon: 124.7200, image: "images/neryungri.jpg", desc: "Южные ворота Якутии. Молодой город шахтёров, окружённый суровой красотой якутской тайги." },
            { steps: 11650000, name: "Якутск 💎", lat: 62.0272, lon: 129.7322, desc: "Старт второго этапа! Вы уже прошли огромный путь. Якутск — город на вечной мерзлоте, где дома стоят на 300-метровых сваях. Двигаемся в Казахстан!" },
            { steps: 12395200, name: "Алдан ⛏️", lat: 58.6017, lon: 125.3894, desc: "Город зародился в 1924 году благодаря настоящей «золотой лихорадке». До сих пор здесь добывают тонны драгоценного металла." },
            { steps: 12760800, name: "Нерюнгри 🚛", lat: 56.6616, lon: 124.7118, desc: "Название переводится как «река хариусов». Город знаменит огромным угольным разрезом, где круглосуточно работают карьерные самосвалы-гиганты." },
            { steps: 13028000, name: "Тында 🚂", lat: 55.1554, lon: 124.7371, desc: "Легендарная столица БАМа. Удивительный город среди бескрайней тайги, застроенный современными 16-этажными высотками московских серий." },
            { steps: 13281000, name: "Сковородино 🛢️", lat: 53.9855, lon: 123.9351, desc: "Важнейшая стратегическая точка. Здесь соединяются Транссиб и БАМ, а также берет начало масштабный нефтепровод напрямую в Китай." },
            { steps: 14827600, name: "Чита 📜", lat: 52.0336, lon: 113.4994, desc: "«Столица декабристов». Жены сосланных сюда в 1827 году участников восстания навсегда изменили культурный облик сурового Забайкалья." },
            { steps: 15741500, name: "Улан-Удэ 🗿", lat: 51.8344, lon: 107.5845, desc: "Главный центр буддизма в России. А на центральной площади города установлена самая большая в мире скульптура головы Ленина весом 42 тонны!" },
            { steps: 16233600, name: "Байкальск 🍓", lat: 51.5204, lon: 104.1485, desc: "Город на берегу великого Байкала. Благодаря уникальному микроклимату озера здесь растет невероятно крупная и сладкая клубника." },
            { steps: 16444500, name: "Иркутск ☕", lat: 52.2870, lon: 104.3050, desc: "В XIX веке Иркутск называли «Сибирским Парижем». Знаменитый 130-й квартал до сих пор хранит уникальные усадьбы с потрясающим «деревянным кружевом»." },
            { steps: 17006900, name: "Тулун 🎒", lat: 54.5583, lon: 100.5750, desc: "Название переводится с бурятского как «кожаный мешок». Река Ия огибает город так, что ее русло действительно напоминает завязанный мешок." },
            { steps: 17569300, name: "Канск 🎬", lat: 56.2056, lon: 95.7000, desc: "Звучит почти как Канны во Франции! Местные жители не упустили совпадение и основали свой собственный международный фестиваль авангардного кино." },
            { steps: 17920800, name: "Красноярск 🧗", lat: 56.0153, lon: 92.8932, desc: "Город с 10-рублевой купюры. Окружен уникальным парком «Красноярские Столбы», где зародился экстремальный спорт — лазание по скалам без страховки." },
            { steps: 18173900, name: "Ачинск 🐎", lat: 56.2694, lon: 90.4993, desc: "Один из старейших городов Красноярского края (1683 г.), некогда бывший важнейшей перевалочной базой на историческом Сибирском тракте." },
            { steps: 18666000, name: "Кемерово ⛏️", lat: 55.3552, lon: 86.0872, desc: "Вы в самом сердце Кузбасса! Прямо в центре города расположен музей-заповедник «Красная Горка», где можно вживую увидеть историю угледобычи." },
            { steps: 19059700, name: "Новосибирск 🎭", lat: 55.0084, lon: 82.9357, desc: "Город рекордов! Здесь находится Красный проспект (самая длинная в мире прямая улица) и самое большое здание театра в России (НОВАТ)." },
            { steps: 19383100, name: "Барнаул 🥈", lat: 53.3498, lon: 83.7836, desc: "В XVIII–XIX веках город был «серебряной столицей» империи. На местных заводах Демидовых выплавляли до 90% всего российского серебра." },
            { steps: 19565800, name: "Алейск 🌾", lat: 52.4938, lon: 82.7788, desc: "Пищевой гигант Алтая. Местные зерноперерабатывающие комбинаты производят колоссальные объемы муки и кормят макаронами половину Сибири." },
            { steps: 19847000, name: "Погранзона (Ауыл) 🛂", lat: 51.1070, lon: 81.6062, desc: "Мы покидаем Россию! Тайга сменяется Великой Степью. Условно достаем паспорта, меняем рубли на тенге и выходим на международный этап!" },
            { steps: 20057900, name: "Семей 🌉", lat: 50.4111, lon: 80.2275, desc: "Гордость города — грандиозный подвесной мост через реку Иртыш. В мире существует всего 17 подобных мостов, а проект разрабатывали японцы." },
            { steps: 20550000, name: "Аягоз 🐪", lat: 47.9654, lon: 80.4390, desc: "Древний оазис и важнейший исторический перекресток. Сотни лет назад здесь отдыхали караваны купцов, шедших по Великому Шелковому пути." },
            { steps: 20893600, name: "Озера Балхаш и Алаколь 🌊", lat: 46.1738, lon: 80.9329, desc: "Балхаш — это геологическая загадка: он наполовину пресный, наполовину соленый! А соседний Алаколь славится целебной водой и черными пляжами." },
            { steps: 20956500, name: "Талдыкорган 🌳", lat: 45.0156, lon: 78.3739, desc: "Столица края Семиречье (Жетысу). Один из самых зеленых и живописных городов Казахстана у подножия величественных гор Джунгарского Алатау." },
            { steps: 20977600, name: "Сарыозек и Поющий Бархан 🏜️", lat: 43.8647, lon: 78.2256, desc: "Чудо природы! Огромная гора светлого песка посреди степи в сухую погоду издает мощный мистический гул. Настоящая планета Арракис из «Дюны»!" },
            { steps: 21000000, name: "Алматы 🍏", lat: 43.2389, lon: 76.8897, desc: "Финиш! Официальная «яблочная столица» мира. Генетики доказали, что все домашние яблоки на планете произошли от местных горных диких яблонь. Вы дошли!" }
        ];

        async function getSteps() {
            const response = await fetch("https://script.google.com/macros/s/AKfycbzlK4Pi3CNDJatS_a8iTckdnA3ADWdtHOw6_8xs0-VbVugZRF6-gphjPTf7cDwX95CA/exec");
            return await response.json();
        }

        let totalSteps = 11650254000;
    
        try {
            const apiData = await getSteps();
            console.log("API DATA:", apiData);
            totalSteps = Number(
	        String(apiData.totalSteps || 0)
                    .replace(/\s/g, '')
            );
            console.log("TOTAL STEPS:", totalSteps);
        } catch (e) {
            console.error("Ошибка загрузки шагов", e);
            document.getElementById('current-city-name').innerText = "Ошибка загрузки данных";
        }
        
        const progressPercent = Math.min(
            (totalSteps / 21000000) * 100,
            100
        );
        
        const filledBlocks = Math.round(progressPercent / 10);
        
        const progressBar =
            "🟦".repeat(filledBlocks) +
            "⬜️".repeat(10 - filledBlocks);
       
        // Находим текущий город
        let currentCity = CITIES[0];
        
        for (let i = 0; i < CITIES.length; i++) {
            if (totalSteps >= CITIES[i].steps) {
                currentCity = CITIES[i];
            }
        }
        
        // Сразу показываем карту России
        const map = L.map('map').setView([61, 105], 4);
        
        // Загружаем карту
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        // Перелет к текущему городу
        setTimeout(() => {
            map.flyTo(
                [currentCity.lat, currentCity.lon],
                5,
                { duration: 1.5 }
            );
        }, 1000);
        
        window.focusCurrentCity = function () {
        
            map.flyTo(
                [currentCity.lat, currentCity.lon],
                6,
                { duration: 1.5 }
            );
        
            map.eachLayer(layer => {
                if (layer.getPopup && layer.getPopup()) {
                    const popup = layer.getPopup();
        
                    if (
                        popup.getContent().includes(currentCity.name)
                    ) {
                        layer.openPopup();
                    }
                }
            });
        };
        // Обновляем плашку внизу экрана
        document.getElementById('current-city-name').innerText = currentCity.name;

        // Отрисовываем города и привязываем к ним описания
        CITIES.forEach(city => {
            // Формируем красивое текстовое окно с описанием как в боте
            const popupText = `
                <div class="leaflet-popup-content-header">
                    ${city.name}
                </div>

                <div style="
                    margin:12px 16px;
                    padding:12px;
                    background:#F5F7F9;
                    border-radius:12px;
                    font-size:13px;
                    line-height:1.6;
                ">
                    📈 ${progressBar} ${progressPercent.toFixed(1)}%<br>
                    👣 ${totalSteps.toLocaleString('ru-RU')} /
                    ${(21000000).toLocaleString('ru-RU')}
                </div>
            
                <div class="leaflet-popup-content-desc">
                    ${city.desc}
                </div>
            `;

            const cityPopup = `
                <div class="leaflet-popup-content-header">
                    ${city.name}
                </div>
            
                <div class="leaflet-popup-content-desc">
                    ${city.desc}
                </div>
            `;
            
            if (city === currentCity) {
            
                const pulseIcon = L.divIcon({
                    className: '',
                    html: '<div class="current-marker"></div>',
                    iconSize: [20, 20],
                    iconAnchor: [10, 10]
                });
            
                const currentMarker = L.marker(
                    [city.lat, city.lon],
                    { icon: pulseIcon }
                ).addTo(map);
            
                currentMarker.bindPopup(popupText);
                currentMarker.openPopup();
            } else if (totalSteps >= city.steps) {
                // Пройденные города — зеленые маркеры
                L.circleMarker([city.lat, city.lon], {
                    radius: 7,
                    fillColor: '#96EA28',
                    color: '#fff',
                    weight: 2,
                    fillOpacity: 1
                }).addTo(map).bindPopup(cityPopup);
            } else {
                // Закрытые города — серые точки
                L.circleMarker([city.lat, city.lon], {
                    radius: 7,
                    fillColor: '#00ABC2',
                    color: '#FFEC2D',
                    weight: 1,
                    fillOpacity: 0.7
                }).addTo(map).bindPopup(`
                    <div class="leaflet-popup-content-header">🔒 ${city.name}</div>
                    <div class="leaflet-popup-content-desc">
                        Город пока закрыт. Требуется шагов всей команды:
                        <b>${city.steps.toLocaleString('ru-RU')}</b>
                    </div>
                `);
            }
        }); // закрываем forEach

})(); // закрываем async функцию
</script>
</body>
</html>
